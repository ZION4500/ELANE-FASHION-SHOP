<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÉLANE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="modal">
    <section class="delivery">
      <p class="eyebrow">Delivery details</p>
      <h1>Where should we send it?</h1>

      <form>
        <div class="row">
          <div class="field">
            <label>FIRST NAME</label>
            <input type="text" placeholder="First name">
          </div>
          <div class="field">
            <label>LAST NAME</label>
            <input type="text" placeholder="Last name">
          </div>
        </div>

        <div class="field">
          <label>EMAIL ADDRESS</label>
          <input type="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label>PHONE NUMBER</label>
          <input type="tel" placeholder="0800 000 0000">
        </div>

        <div class="field">
          <label>DELIVERY ADDRESS</label>
          <input type="text" placeholder="Street address">
        </div>

        <div class="row">
          <div class="field">
            <label>CITY</label>
            <input type="text" value="Lagos">
          </div>
          <div class="field">
            <label>STATE</label>
            <select>
              <option>Lagos</option>
              <option>Abuja</option>
            </select>
          </div>
        </div>

        <button class="submit">REVIEW ORDER →</button>
      </form>
    </section>

    <aside class="summary">
      <p class="eyebrow">Order summary</p>
      <div class="item">
          <img src="images/item1.jpg" alt="product">
        <div class="item-info">
          <div class="name">Satin Slip Dress</div>
          <div class="meta">Size: M · Color: Almond</div>
        </div>
        <div class="item-price">₦12800</div>
      </div>

      <div class="item">
          <img src="images/item2.jpg" alt="product">
        <div class="item-info">
          <div class="name">Serein sculpted top</div>
          <div class="meta">Size: 38 · Color: Tan</div>
        </div>
        <div class="item-price">₦7400</div>
      </div>

      <div class="totals">
        <div class="subrow"><span>Items</span><span>₦20200</span></div>
        <div class="subrow"><span>Shipping</span><span>₦35000</span></div>
        <div class="total-line"><div class="label">Total</div><div class="value">₦55200</div></div>
      </div>
    </aside>
  </div>
</body>
</html>
